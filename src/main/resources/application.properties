spring.application.name=super-inter-backend

# Carga variables locales desde .env (si existe). El archivo no se versiona.
spring.config.import=optional:file:.env[.properties]

# Conexión a PostgreSQL mediante JDBC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Tokens JWT del inicio de sesión (evidencia AA5-EV01).
# El secreto no tiene valor por defecto: si falta, la aplicación no arranca, para no
# firmar tokens con una clave conocida.
superinter.jwt.secreto=${JWT_SECRET}
superinter.jwt.emisor=super-inter
superinter.jwt.expiracion=${JWT_EXPIRACION:60m}
